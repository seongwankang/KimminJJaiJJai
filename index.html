
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교생활 아이디어 제안함</title>

<style>
/* ==========================================
   1. 기본 설정과 전역 색상
========================================== */
* {
    box-sizing: border-box;
}

@property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
}

:root {
    --hue: 250;
    --typing-hue: 200;
    --mouse-x: 50%;
    --mouse-y: 50%;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    padding: 40px 16px 80px;
    font-family: "맑은 고딕", Arial, sans-serif;
    color: white;
    background: #090d25;
    isolation: isolate;
}

/* ==========================================
   2. 우주형 움직이는 배경
========================================== */
body::before {
    content: "";
    position: fixed;
    inset: -40%;
    z-index: -4;
    pointer-events: none;

    background:
        radial-gradient(ellipse at 20% 30%,
            #8b26ed 0%, transparent 35%),
        radial-gradient(ellipse at 80% 20%,
            #008fdb 0%, transparent 35%),
        radial-gradient(ellipse at 50% 85%,
            #e3269b 0%, transparent 38%),
        radial-gradient(ellipse at 95% 80%,
            #4930da 0%, transparent 35%);

    filter: hue-rotate(calc(var(--hue) * 1deg));

    animation: universeMove 20s ease-in-out infinite alternate;
}

@keyframes universeMove {
    0% {
        transform: rotate(0deg) scale(1);
    }
    50% {
        transform: rotate(10deg) scale(1.2);
    }
    100% {
        transform: rotate(-10deg) scale(1.05);
    }
}

/* 별빛 캔버스 */
#ambientCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    pointer-events: none;
}

/* 배경 격자 */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

    background-size: 45px 45px;
}

/* 움직이는 빛 덩어리 */
.orb {
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(90px);
    opacity: .45;
    animation: orbFloat 13s ease-in-out infinite alternate;
}

.orb.one {
    width: 280px;
    height: 280px;
    background: #9c35ff;
    left: -100px;
    top: 10%;
}

.orb.two {
    width: 350px;
    height: 350px;
    background: #00c8ff;
    right: -130px;
    bottom: 5%;
    animation-delay: -4s;
}

.orb.three {
    width: 180px;
    height: 180px;
    background: #ff39a9;
    top: 50%;
    left: 70%;
    animation-delay: -7s;
}

@keyframes orbFloat {
    from {
        transform: translate(0, 0) scale(.8);
    }
    to {
        transform: translate(100px, -80px) scale(1.4);
    }
}

/* 마우스 따라오는 빛 */
#cursorGlow {
    position: fixed;
    z-index: 1;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    pointer-events: none;

    background: radial-gradient(
        circle,
        rgba(116, 75, 255, .13),
        rgba(0, 204, 255, .04) 40%,
        transparent 70%
    );

    transform: translate(-50%, -50%);
    left: 50%;
    top: 50%;
}

/* ==========================================
   3. 스크롤 진행 표시
========================================== */
#scrollProgress {
    position: fixed;
    z-index: 2000;
    top: 0;
    left: 0;
    width: 0%;
    height: 4px;

    background: linear-gradient(
        90deg,
        #00eaff,
        #9c45ff,
        #ff36ae,
        #ffe45c
    );

    box-shadow: 0 0 15px #a64dff;
    transition: width .08s linear;
}

/* ==========================================
   4. 메인 컨테이너
========================================== */
.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 780px;
    margin: auto;
    padding: 35px;

    background: rgba(13, 19, 51, .78);
    backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 28px;

    box-shadow:
        0 0 40px rgba(110,50,255,.2),
        0 25px 90px rgba(0,0,0,.4);
}

/* 회전 네온 테두리 */
.container::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    padding: 2px;

    background: conic-gradient(
        from var(--angle),
        #ff30ca,
        #8a4cff,
        #00eaff,
        #42ffab,
        #ffea5b,
        #ff30ca
    );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
    z-index: -1;

    animation: borderSpin 7s linear infinite;
}

@keyframes borderSpin {
    to {
        --angle: 360deg;
    }
}

/* ==========================================
   5. 제목
========================================== */
.header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    display: inline-block;
    font-size: 66px;
    filter: drop-shadow(0 0 20px #bd60ff);
    animation: logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {
    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }
    50% {
        transform: translateY(-15px) rotate(8deg);
    }
}

h1 {
    margin: 12px 0;
    font-size: 31px;
    font-weight: 900;

    background: linear-gradient(
        90deg,
        white,
        #54eeff,
        #ff73db,
        #fff,
        #54eeff
    );

    background-size: 300%;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;

    animation: titleRainbow 5s linear infinite;
}

@keyframes titleRainbow {
    to {
        background-position: 300%;
    }
}

.description {
    color: #cbd7ff;
    font-size: 14px;
    line-height: 1.9;
}

/* ==========================================
   6. 폼 카드
========================================== */
.form-card {
    position: relative;
    padding: 26px;

    color: #263554;
    background: rgba(255,255,255,.96);
    border-radius: 20px;

    box-shadow: 0 15px 40px rgba(0,0,0,.25);

    transition: box-shadow .3s;
}

.form-card:focus-within {
    box-shadow:
        0 0 0 3px rgba(148,90,255,.3),
        0 0 35px rgba(107,81,255,.25);
}

.form-group {
    margin-bottom: 23px;
}

label {
    display: block;
    margin-bottom: 11px;
    font-size: 15px;
    font-weight: 900;
}

select,
textarea {
    width: 100%;
    padding: 15px;
    border: 2px solid #e3e8fa;
    border-radius: 13px;
    background: #f7f9ff;
    color: #283858;
    font-family: inherit;
    font-size: 15px;
    transition: .25s;
}

select {
    cursor: pointer;
}

select:focus,
textarea:focus {
    outline: none;
}

/* 분야 선택 효과 */
select:focus {
    border-color: #8763ff;
    box-shadow: 0 0 20px #875dff55;
    background: white;
}

/* 분야 선택 시 색상 */
select.changed {
    animation: selectFlash .45s ease;
}

@keyframes selectFlash {
    50% {
        transform: scale(1.015);
        box-shadow: 0 0 25px #bd55ff88;
    }
}

/* ==========================================
   7. 타이핑 입력창
========================================== */
.textarea-wrap {
    position: relative;
    border-radius: 15px;
    transition: .2s;
}

.textarea-wrap::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 17px;

    background: linear-gradient(
        120deg,
        hsl(var(--typing-hue), 100%, 65%),
        #ff52cb,
        #38eaff,
        #a55bff
    );

    background-size: 300%;
    filter: blur(12px);
    opacity: 0;
    transition: opacity .2s;
    animation: typingBorder 3s linear infinite;
}

@keyframes typingBorder {
    to {
        background-position: 300%;
    }
}

.textarea-wrap.focused::before {
    opacity: .8;
}

textarea {
    position: relative;
    z-index: 1;
    min-height: 145px;
    resize: vertical;
    line-height: 1.8;
    border-color: hsl(var(--typing-hue), 70%, 75%);
    transition:
        border-color .12s,
        color .12s,
        box-shadow .2s;
}

textarea:focus {
    background: white;
    box-shadow: 0 0 0 4px hsl(var(--typing-hue), 90%, 75%, .2);
}

textarea::placeholder {
    color: #a0a9bd;
}

/* 입력할 때 흔들리는 효과 */
.textarea-wrap.typing-flash {
    animation: typingFlash .17s ease;
}

@keyframes typingFlash {
    0% { transform: scale(1); }
    40% { transform: scale(1.012); }
    100% { transform: scale(1); }
}

/* 글자수 카운터 */
.counter {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-top: 9px;
    color: #8893ad;
}

.counter strong {
    color: #7860ed;
}

.counter.warning-count strong {
    color: #ff3e72;
}

/* ==========================================
   8. 모든 버튼 공통 인터랙션
========================================== */
button {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    font-family: inherit;
    border: none;
    isolation: isolate;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
}

button:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 3px solid #ffcd54;
    outline-offset: 4px;
}

button:active {
    transform: scale(.93);
    filter: brightness(1.25);
}

/* 클릭 물결 */
.ripple {
    position: absolute;
    z-index: 1;
    border-radius: 50%;
    background: rgba(255,255,255,.65);
    transform: scale(0);
    pointer-events: none;

    animation: rippleEffect .65s ease-out forwards;
}

@keyframes rippleEffect {
    to {
        transform: scale(3);
        opacity: 0;
    }
}

/* ==========================================
   9. 메인 등록 버튼
========================================== */
.submit-button {
    width: 100%;
    padding: 18px;
    border-radius: 15px;
    color: white;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;

    background: linear-gradient(
        100deg,
        #573cff,
        #b23dff,
        #ff36ae,
        #ff8b42,
        #573cff
    );

    background-size: 300% 300%;

    box-shadow: 0 8px 25px #9845ff70;
    animation: submitRainbow 4s linear infinite;
}

@keyframes submitRainbow {
    to {
        background-position: 300% center;
    }
}

.submit-button:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow:
        0 0 15px #ff3bcb,
        0 0 35px #a342ff,
        0 12px 35px #573cff88;
}

.submit-button::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -100%;
    width: 60%;
    height: 200%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.65),
        transparent
    );
    transform: rotate(25deg);
    transition: left .7s;
    z-index: 2;
}

.submit-button:hover::before {
    left: 150%;
}

/* ==========================================
   10. 보조 버튼
========================================== */
.secondary-button {
    padding: 12px 17px;
    border-radius: 11px;
    color: #6849d9;
    background: #eeeaff;
    font-weight: bold;
}

.secondary-button:hover {
    background: #dfd6ff;
    transform: translateY(-2px);
    box-shadow: 0 5px 18px #9270ff44;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

/* ==========================================
   11. 오류 메시지
========================================== */
.warning {
    display: none;
    padding: 13px;
    margin: 16px 0 0;
    border-radius: 12px;
    color: #c52e51;
    background: #ffedf1;
    font-weight: bold;
    font-size: 14px;
}

.form-card.error-shake {
    animation: errorShake .45s ease;
}

@keyframes errorShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
}

/* ==========================================
   12. 갤러리 목록
========================================== */
.list-section {
    margin-top: 40px;
}

.list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.list-header h2 {
    margin: 0;
    font-size: 21px;
}

.count {
    padding: 9px 17px;
    border-radius: 40px;
    background: linear-gradient(100deg, #6253ff, #e53dc0);
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 0 20px #9c50ff77;
}

.idea-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* 카드 */
.idea-item {
    position: relative;
    padding: 20px;
    border-radius: 17px;

    color: #283653;
    background: linear-gradient(
        130deg,
        #fff,
        #eff0ff,
        #fff0fa
    );

    border: 1px solid rgba(255,255,255,.7);
    border-left: 5px solid hsl(var(--card-hue), 90%, 60%);

    box-shadow: 0 8px 25px #00000025;

    transform-style: preserve-3d;
    transition: border-color .2s, box-shadow .2s;

    animation: cardEntrance .55s cubic-bezier(.18,.89,.32,1.5) both;
}

@keyframes cardEntrance {
    0% {
        opacity: 0;
        transform: translateY(35px) scale(.65) rotate(-5deg);
    }
    70% {
        opacity: 1;
        transform: translateY(-5px) scale(1.04) rotate(1deg);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
    }
}

.idea-item:hover {
    box-shadow:
        0 15px 35px #00000040,
        0 0 18px hsl(var(--card-hue), 100%, 70%, .2);
}

.idea-item.removing {
    animation: cardVanish .35s ease forwards;
}

@keyframes cardVanish {
    to {
        opacity: 0;
        transform: scale(.2) rotate(18deg);
        filter: blur(12px);
    }
}

.idea-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 13px;
}

.idea-category {
    padding: 7px 14px;
    border-radius: 30px;
    color: white;
    font-size: 13px;
    font-weight: bold;

    background: linear-gradient(
        100deg,
        hsl(var(--card-hue), 90%, 60%),
        hsl(calc(var(--card-hue) + 50), 90%, 60%)
    );

    box-shadow: 0 4px 13px hsl(var(--card-hue), 90%, 65%, .3);
}

.idea-date {
    font-size: 11px;
    color: #9da6bb;
    margin-left: auto;
}

.idea-content {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.8;
}

/* 카드 버튼 */
.idea-actions {
    display: flex;
    gap: 9px;
    margin-top: 17px;
    flex-wrap: wrap;
}

.action-button {
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
}

.like-button {
    color: #d22b85;
    background: #ffe8f5;
}

.like-button:hover {
    box-shadow: 0 0 17px #ff53b577;
    transform: translateY(-3px) scale(1.05);
}

.like-button.liked {
    background: linear-gradient(100deg, #ff50a2, #ff3673);
    color: white;
    box-shadow: 0 0 17px #ff53b588;
}

.copy-button {
    color: #3155b6;
    background: #e5edff;
}

.copy-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 15px #648dff77;
}

.delete-button {
    margin-left: auto;
    color: white;
    background: linear-gradient(100deg, #ff606f, #eb2e57);
}

.delete-button:hover {
    transform: rotate(-3deg) scale(1.08);
    box-shadow: 0 0 18px #ff466d88;
}

.empty-message {
    padding: 40px 15px;
    text-align: center;
    color: #ced8ff;
    border: 2px dashed rgba(255,255,255,.3);
    border-radius: 17px;
    line-height: 2;
}

/* ==========================================
   13. 폭죽 / 입자 레이어
========================================== */
#effectsLayer {
    position: fixed;
    inset: 0;
    z-index: 3000;
    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;
    left: 0;
    top: 0;

    width: var(--size);
    height: var(--size);

    background: hsl(var(--hue), 100%, 65%);
    border-radius: var(--shape, 50%);
    box-shadow: 0 0 12px hsl(var(--hue), 100%, 65%);

    animation: particleFly var(--duration, 850ms) cubic-bezier(.1,.7,.3,1) forwards;
}

@keyframes particleFly {
    0% {
        opacity: 1;
        transform: translate(0,0) rotate(0) scale(1.3);
    }

    100% {
        opacity: 0;
        transform: translate(var(--dx),var(--dy))
            rotate(var(--rotation)) scale(0);
    }
}

/* 폭발 링 */
.burst-ring {
    position: absolute;
    border: 3px solid hsl(var(--hue), 100%, 70%);
    border-radius: 50%;
    transform: translate(-50%,-50%);

    animation: ringExplosion .7s ease-out forwards;
    box-shadow: 0 0 20px hsl(var(--hue), 100%, 65%);
}

@keyframes ringExplosion {
    from {
        width: 5px;
        height: 5px;
        opacity: 1;
    }
    to {
        width: 150px;
        height: 150px;
        opacity: 0;
    }
}

/* 하트 */
.floating-heart {
    position: fixed;
    z-index: 3002;
    pointer-events: none;
    font-size: 24px;
    animation: heartFly .85s ease-out forwards;
}

@keyframes heartFly {
    to {
        opacity: 0;
        transform: translateY(-85px) scale(1.8) rotate(25deg);
    }
}

/* 토스트 알림 */
#toastRegion {
    position: fixed;
    z-index: 4000;
    right: 20px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
    pointer-events: none;
}

.toast {
    padding: 14px 20px;
    max-width: min(90vw, 360px);
    border-radius: 13px;
    color: white;
    font-size: 14px;
    font-weight: bold;

    background: rgba(30,35,75,.95);
    border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 5px 30px #0006;

    animation: toastEnter .35s cubic-bezier(.2,1.4,.4,1);
}

.toast.success {
    border-left: 4px solid #43f7bc;
}

.toast.error {
    border-left: 4px solid #ff5278;
}

.toast.exit {
    animation: toastExit .25s ease forwards;
}

@keyframes toastEnter {
    from {
        opacity: 0;
        transform: translateX(40px) scale(.8);
    }
    to {
        opacity: 1;
        transform: translateX(0) scale(1);
    }
}

@keyframes toastExit {
    to {
        opacity: 0;
        transform: translateX(40px);
    }
}

/* 접근성 */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

/* ==========================================
   14. 모바일
========================================== */
@media(max-width: 560px) {
    body {
        padding: 18px 10px 60px;
    }

    .container {
        padding: 22px 15px;
    }

    h1 {
        font-size: 23px;
    }

    .logo {
        font-size: 52px;
    }

    .form-card {
        padding: 18px;
    }

    .list-header h2 {
        font-size: 17px;
    }

    #cursorGlow {
        display: none;
    }
}
</style>
</head>

<body>

<!-- 배경 장식 -->
<canvas id="ambientCanvas"></canvas>

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<!-- 마우스 빛 -->
<div id="cursorGlow"></div>

<!-- 스크롤 진행 바 -->
<div id="scrollProgress"></div>

<!-- 효과 생성 공간 -->
<div id="effectsLayer"></div>

<!-- 알림 공간 -->
<div id="toastRegion" aria-live="polite"></div>


<!-- =====================================
     메인 화면
===================================== -->
<main class="container">

    <header class="header">
        <div class="logo">💡</div>

        <h1>학교생활 아이디어 제안함</h1>

        <p class="description">
            ✨ 여러분의 아이디어가 학교를 바꿉니다! ✨<br>
            자유롭게 상상하고 마음껏 제안해 주세요.
        </p>
    </header>


    <!-- =================================
         입력 폼
    ================================== -->
    <section class="form-card" id="formCard">

        <form id="ideaForm">

            <div class="form-group">
                <label for="category">🌈 제안 분야 선택</label>

                <select id="category" required>
                    <option value="">분야를 선택하세요</option>
                    <option value="시설">🏫 시설</option>
                    <option value="수업">📚 수업</option>
                    <option value="급식">🍱 급식</option>
                    <option value="기타">✨ 기타</option>
                </select>
            </div>


            <div class="form-group">

                <label for="ideaContent">
                    ✏️ 제안 내용
                </label>

                <div class="textarea-wrap" id="textareaWrap">

                    <textarea
                        id="ideaContent"
                        maxlength="500"
                        placeholder="학교를 바꿀 멋진 아이디어를 입력해 보세요!"
                        required
                    ></textarea>

                </div>

                <div class="counter" id="counter">
                    <span>💫 글자 하나하나가 아이디어입니다.</span>
                    <strong id="charCount">0 / 500</strong>
                </div>

            </div>


            <button
                type="submit"
                class="submit-button"
                id="submitButton"
            >
                🚀 아이디어 등록하기 💥
            </button>

            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-button"
                    id="clearButton"
                >
                    ↺ 입력 초기화
                </button>

            </div>

            <p class="warning" id="warningMessage" role="alert">
                ⚠️ 분야와 제안 내용을 모두 입력해 주세요!
            </p>

        </form>
    </section>


    <!-- =================================
         아이디어 갤러리
    ================================== -->
    <section class="list-section">

        <div class="list-header">
            <h2>✨ 아이디어 갤러리</h2>

            <span class="count">
                TOTAL <span id="ideaCount">0</span>
            </span>
        </div>

        <div class="idea-list" id="ideaList" aria-live="polite">

            <div class="empty-message">
                🌟 아직 등록된 아이디어가 없습니다.<br>
                첫 번째 아이디어를 등록해 보세요!
            </div>

        </div>

    </section>

</main>


<script>
/* ==========================================
   1. HTML 요소 연결
========================================== */

// Google Apps Script 웹 앱 배포 후 받은 /exec 주소를 여기에 붙여 넣으세요.
// 예: https://script.google.com/macros/s/배포ID/exec
const GAS_WEB_APP_URL = "여기에_웹앱_배포_URL을_붙여넣으세요";

const form = document.getElementById("ideaForm");
const formCard = document.getElementById("formCard");
const categoryInput = document.getElementById("category");
const contentInput = document.getElementById("ideaContent");
const textareaWrap = document.getElementById("textareaWrap");

const warning = document.getElementById("warningMessage");
const ideaList = document.getElementById("ideaList");
const ideaCount = document.getElementById("ideaCount");
const charCount = document.getElementById("charCount");
const counter = document.getElementById("counter");

const effectsLayer = document.getElementById("effectsLayer");
const toastRegion = document.getElementById("toastRegion");
const cursorGlow = document.getElementById("cursorGlow");

let typingHue = 190;
let lastTrailTime = 0;
let toastTimers = new WeakMap();

const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
).matches;


/* ==========================================
   2. 별빛 배경 캔버스
========================================== */

const canvas = document.getElementById("ambientCanvas");
const ctx = canvas.getContext("2d");

let stars = [];
let canvasWidth = window.innerWidth;
let canvasHeight = window.innerHeight;

function resizeCanvas() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvasWidth = window.innerWidth;
    canvasHeight = window.innerHeight;

    canvas.width = canvasWidth * dpr;
    canvas.height = canvasHeight * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 화면 크기에 따라 별 개수 조절
    const count = Math.min(
        100,
        Math.floor(canvasWidth / 13)
    );

    stars = Array.from({ length: count }, () => ({
        x: Math.random() * canvasWidth,
        y: Math.random() * canvasHeight,
        radius: Math.random() * 1.8 + .3,
        speed: Math.random() * .28 + .05,
        alpha: Math.random() * .7 + .2,
        phase: Math.random() * Math.PI * 2,
        hue: Math.random() * 100 + 170
    }));

    drawStars(0);
}

function drawStars(time) {

    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    stars.forEach(star => {

        if (!reducedMotion) {
            star.y += star.speed;

            if (star.y > canvasHeight) {
                star.y = 0;
                star.x = Math.random() * canvasWidth;
            }
        }

        const glow = reducedMotion
            ? star.alpha
            : star.alpha * (
                .55 + Math.sin(time / 900 + star.phase) * .35
            );

        ctx.beginPath();
        ctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(${star.hue}, 100%, 80%, ${glow})`;

        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsl(${star.hue},100%,70%)`;
        ctx.fill();
    });

    ctx.shadowBlur = 0;

    // 가까운 별끼리 희미한 선으로 연결
    for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {

            const a = stars[i];
            const b = stars[j];

            const distance = Math.hypot(
                a.x - b.x,
                a.y - b.y
            );

            if (distance < 85) {

                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);

                ctx.strokeStyle =
                    `rgba(130,180,255,${.12 * (1-distance/85)})`;

                ctx.lineWidth = .6;
                ctx.stroke();
            }
        }
    }
}

function animateStars(time) {
    drawStars(time);

    if (!reducedMotion) {
        requestAnimationFrame(animateStars);
    }
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();

if (!reducedMotion) {
    requestAnimationFrame(animateStars);
}


/* ==========================================
   3. 폭죽 및 파티클 엔진
========================================== */

function createBurst(x, y, amount = 20, power = 110) {

    if (reducedMotion) {
        return;
    }

    // 과도한 DOM 입자 방지
    while (effectsLayer.childElementCount > 350) {
        effectsLayer.firstElementChild.remove();
    }

    // 중심 폭발 링
    const ring = document.createElement("div");

    ring.className = "burst-ring";
    ring.style.left = x + "px";
    ring.style.top = y + "px";
    ring.style.setProperty(
        "--hue",
        Math.random() * 360
    );

    effectsLayer.appendChild(ring);

    ring.addEventListener("animationend", () => ring.remove());


    // 폭발 입자 생성
    for (let i = 0; i < amount; i++) {

        const particle = document.createElement("span");

        particle.className = "particle";

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * power + 20;

        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        const hue = Math.floor(Math.random() * 360);
        const size = Math.random() * 8 + 3;

        particle.style.left = x + "px";
        particle.style.top = y + "px";

        particle.style.setProperty("--dx", dx + "px");
        particle.style.setProperty("--dy", dy + "px");
        particle.style.setProperty("--hue", hue);
        particle.style.setProperty("--size", size + "px");
        particle.style.setProperty(
            "--duration",
            (500 + Math.random() * 600) + "ms"
        );

        particle.style.setProperty(
            "--rotation",
            (Math.random() * 720 - 360) + "deg"
        );

        particle.style.setProperty(
            "--shape",
            Math.random() > .5 ? "50%" : "2px"
        );

        effectsLayer.appendChild(particle);

        particle.addEventListener(
            "animationend",
            () => particle.remove()
        );
    }
}


/* 여러 지점에서 연속 폭죽 */
function megaBurst(x, y) {

    createBurst(x, y, 65, 180);

    if (reducedMotion) return;

    for (let i = 0; i < 3; i++) {

        setTimeout(() => {

            const dx = x + (Math.random() - .5) * 220;
            const dy = y + (Math.random() - .5) * 130;

            createBurst(dx, dy, 25, 95);

        }, (i + 1) * 160);
    }
}


/* ==========================================
   4. 마우스 이동 효과
========================================== */

document.addEventListener("pointermove", function(event) {

    // 마우스 이동에서만 커서 빛 활성화
    if (event.pointerType === "mouse") {

        cursorGlow.style.left = event.clientX + "px";
        cursorGlow.style.top = event.clientY + "px";
    }

    // 마우스 궤적 파티클은 일정 간격으로 생성
    const now = performance.now();

    if (
        event.pointerType === "mouse" &&
        now - lastTrailTime > 65
    ) {

        lastTrailTime = now;

        createBurst(
            event.clientX,
            event.clientY,
            2,
            22
        );
    }

    // 카드 3D 반응
    const card = event.target.closest(".idea-item");

    if (card && event.pointerType === "mouse" && !reducedMotion) {

        const rect = card.getBoundingClientRect();

        const rx = (
            (event.clientY - rect.top) / rect.height - .5
        ) * -5;

        const ry = (
            (event.clientX - rect.left) / rect.width - .5
        ) * 5;

        card.style.transform =
            `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-2px)`;
    }
});


/* 카드에서 마우스가 나가면 원상 복귀 */
ideaList.addEventListener("pointerout", function(event) {

    const card = event.target.closest(".idea-item");

    if (
        card &&
        (!event.relatedTarget || !card.contains(event.relatedTarget))
    ) {
        card.style.transform = "";
    }
});


/* ==========================================
   5. 마우스 클릭 효과
========================================== */

document.addEventListener("pointerdown", function(event) {

    const button = event.target.closest("button");

    // 버튼 종류에 따라 클릭 효과 차별화
    let count = 7;
    let power = 55;

    if (button) {

        if (button.classList.contains("submit-button")) {
            count = 20;
            power = 100;
        }

        else if (button.classList.contains("delete-button")) {
            count = 13;
            power = 75;
        }

        else if (button.classList.contains("like-button")) {
            count = 18;
            power = 85;
        }

        else {
            count = 10;
            power = 65;
        }

        // 버튼 내부 물결
        createRipple(button, event.clientX, event.clientY);
    }

    createBurst(event.clientX, event.clientY, count, power);

});


/* 키보드로 클릭해도 시각 효과 발생 */
document.addEventListener("click", function(event) {

    if (event.detail !== 0) return;

    const target = event.target.closest(
        "button, select"
    ) || event.target;

    const rect = target.getBoundingClientRect();

    createBurst(
        rect.left + rect.width / 2,
        rect.top + rect.height / 2,
        15,
        70
    );
});


/* ==========================================
   6. 버튼 물결 효과
========================================== */

function createRipple(button, x, y) {

    const rect = button.getBoundingClientRect();

    const size = Math.max(
        rect.width,
        rect.height
    );

    const ripple = document.createElement("span");

    ripple.className = "ripple";

    ripple.style.width = size + "px";
    ripple.style.height = size + "px";

    ripple.style.left =
        (x - rect.left - size / 2) + "px";

    ripple.style.top =
        (y - rect.top - size / 2) + "px";

    button.appendChild(ripple);

    ripple.addEventListener("animationend", () => {
        ripple.remove();
    });
}


/* ==========================================
   7. 버튼 호버 효과
========================================== */

document.addEventListener("pointerover", function(event) {

    const button = event.target.closest("button");

    if (!button || event.pointerType === "touch") return;

    if (button.contains(event.relatedTarget)) return;

    if (!reducedMotion) {

        createBurst(
            event.clientX,
            event.clientY,
            4,
            24
        );
    }
});


/* ==========================================
   8. 입력 포커스 효과
========================================== */

document.addEventListener("focusin", function(event) {

    if (
        event.target === contentInput ||
        event.target === categoryInput
    ) {

        textareaWrap.classList.add("focused");

        const rect = event.target.getBoundingClientRect();

        createBurst(
            rect.left + rect.width / 2,
            rect.top + rect.height / 2,
            12,
            50
        );

        showToast(
            "✨ 새로운 아이디어를 입력할 준비 완료!",
            "success"
        );
    }
});


document.addEventListener("focusout", function(event) {

    if (
        event.target === contentInput ||
        event.target === categoryInput
    ) {

        textareaWrap.classList.remove("focused");

        const rect = event.target.getBoundingClientRect();

        createBurst(
            rect.left + rect.width / 2,
            rect.top + rect.height / 2,
            6,
            35
        );
    }
});


/* ==========================================
   9. 글자 입력별 색상 효과
========================================== */

function updateTypingEffect() {

    const length = Array.from(contentInput.value).length;

    charCount.textContent = length + " / 500";

    // 입력량에 따라 카운터 색상 변경
    counter.classList.toggle(
        "warning-count",
        length >= 400
    );

    // 글자 입력마다 색조 변화
    typingHue = (typingHue + 37) % 360;

    textareaWrap.style.setProperty(
        "--typing-hue",
        typingHue
    );

    document.documentElement.style.setProperty(
        "--hue",
        typingHue
    );

    // 입력 테두리 색상
    contentInput.style.borderColor =
        `hsl(${typingHue}, 85%, 65%)`;

    contentInput.style.color =
        `hsl(${typingHue}, 85%, 35%)`;

    contentInput.style.caretColor =
        `hsl(${typingHue}, 100%, 45%)`;

    // 순간적으로 빛나는 효과
    textareaWrap.classList.remove("typing-flash");

    void textareaWrap.offsetWidth;

    textareaWrap.classList.add("typing-flash");

    // 글자가 입력되는 위치에 미니 입자 발생
    const rect = contentInput.getBoundingClientRect();

    createBurst(
        rect.right - 22,
        rect.top + 25 + Math.random() * 35,
        3,
        24
    );

    warning.style.display = "none";
}

contentInput.addEventListener("input", function(event) {

    // 한글 조합 중간 상태에서는 시각 효과를 반복하지 않음
    if (!event.isComposing) {
        updateTypingEffect();
    } else {
        charCount.textContent =
            Array.from(contentInput.value).length + " / 500";
    }
});

contentInput.addEventListener("compositionend", updateTypingEffect);


/* ==========================================
   10. 붙여넣기 이벤트
========================================== */

contentInput.addEventListener("paste", function() {

    setTimeout(() => {

        const rect = contentInput.getBoundingClientRect();

        megaBurst(
            rect.left + rect.width / 2,
            rect.top + 30
        );

        showToast(
            "📋 내용을 붙여넣었습니다!",
            "success"
        );

        updateTypingEffect();

    }, 0);
});


/* ==========================================
   11. 분야 선택 이벤트
========================================== */

const categoryHues = {
    "시설": 190,
    "수업": 260,
    "급식": 35,
    "기타": 320
};

categoryInput.addEventListener("change", function() {

    const rect = categoryInput.getBoundingClientRect();

    const hue = categoryHues[categoryInput.value] ?? 200;

    document.documentElement.style.setProperty(
        "--hue",
        hue
    );

    categoryInput.classList.remove("changed");

    void categoryInput.offsetWidth;

    categoryInput.classList.add("changed");

    createBurst(
        rect.left + rect.width / 2,
        rect.top + rect.height / 2,
        22,
        80
    );

    showToast(
        "🎨 " + categoryInput.options[
            categoryInput.selectedIndex
        ].text + " 분야를 선택했습니다!",
        "success"
    );

    warning.style.display = "none";
});


/* ==========================================
   12. 토스트 메시지
========================================== */

function showToast(message, type = "success") {

    const toast = document.createElement("div");

    toast.className = "toast " + type;
    toast.textContent = message;

    toastRegion.appendChild(toast);

    const oldTimer = toastTimers.get(toast);

    if (oldTimer) clearTimeout(oldTimer);

    const timer = setTimeout(() => {

        toast.classList.add("exit");

        setTimeout(() => toast.remove(), 260);

    }, 2400);

    toastTimers.set(toast, timer);

    // 알림 개수 제한
    while (toastRegion.children.length > 4) {
        toastRegion.firstElementChild.remove();
    }
}


/* ==========================================
   Google Apps Script API 통신
   GitHub Pages에서 호출하므로 google.script.run 대신 fetch 사용
========================================== */

// GAS 웹 앱 주소가 올바르게 설정되어 있는지 확인합니다.
function validateApiUrl() {
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("여기에_웹앱_배포_URL")) {
        throw new Error("index.html의 GAS_WEB_APP_URL에 Apps Script 배포 URL을 입력해 주세요.");
    }
}

// 시트의 아이디어 목록을 읽어옵니다.
async function apiGet(action) {
    validateApiUrl();

    const url = GAS_WEB_APP_URL
        + "?action=" + encodeURIComponent(action)
        + "&t=" + Date.now();

    const response = await fetch(url, {
        method: "GET",
        mode: "cors",
        cache: "no-store",
        redirect: "follow",
        credentials: "omit"
    });

    if (!response.ok) {
        throw new Error("서버 응답 오류 (HTTP " + response.status + ")");
    }

    const result = await response.json();

    if (!result || result.success !== true) {
        throw new Error(result && result.message ? result.message : "서버에서 목록을 불러오지 못했습니다.");
    }

    return result;
}

// 제안 등록·삭제·공감수 변경 요청을 서버로 보냅니다.
// text/plain을 사용해 CORS 사전 요청(OPTIONS)이 발생하지 않도록 합니다.
async function apiPost(payload) {
    validateApiUrl();

    const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "cors",
        redirect: "follow",
        credentials: "omit",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
    });

    if (!response.ok) {
        throw new Error("서버 응답 오류 (HTTP " + response.status + ")");
    }

    const result = await response.json();

    if (!result || result.success !== true) {
        throw new Error(result && result.message ? result.message : "서버 작업에 실패했습니다.");
    }

    return result;
}


/* ==========================================
   13. 공감 하트 효과
========================================== */

function createHeart(x, y) {

    if (reducedMotion) return;

    const heart = document.createElement("span");

    heart.className = "floating-heart";

    heart.textContent = [
        "💖", "💗", "💜", "💝", "✨"
    ][Math.floor(Math.random() * 5)];

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    document.body.appendChild(heart);

    heart.addEventListener("animationend", () => {
        heart.remove();
    });
}


/* ==========================================
   14. 아이디어 등록
========================================== */

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const category = categoryInput.value;
    const content = contentInput.value.trim();
    const submitButton = document.getElementById("submitButton");

    // 입력 검사: 분야와 내용이 모두 있어야 저장합니다.
    if (!category || !content) {

        warning.style.display = "block";

        formCard.classList.remove("error-shake");
        void formCard.offsetWidth;
        formCard.classList.add("error-shake");

        const rect = formCard.getBoundingClientRect();
        megaBurst(rect.left + rect.width / 2, rect.top + 160);

        showToast("⚠️ 분야와 제안 내용을 모두 입력해 주세요!", "error");

        if (!category) {
            categoryInput.focus();
        } else {
            contentInput.focus();
        }
        return;
    }

    warning.style.display = "none";
    submitButton.disabled = true;
    submitButton.dataset.originalText = submitButton.textContent;
    submitButton.textContent = "⏳ Google Sheets에 저장 중...";

    try {
        // 서버가 Google Sheets에 저장한 뒤 성공 응답을 보내면 화면에 추가합니다.
        const result = await apiPost({
            action: "save",
            category: category,
            content: content
        });

        addIdea(
            result.idea.category,
            result.idea.content,
            result.idea.id,
            result.idea.createdAt,
            result.idea.likes,
            true
        );

        const rect = submitButton.getBoundingClientRect();
        megaBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

        // 저장 성공 후에만 입력창을 비웁니다.
        form.reset();
        charCount.textContent = "0 / 500";
        textareaWrap.classList.remove("focused");
        textareaWrap.style.setProperty("--typing-hue", 190);
        contentInput.style.borderColor = "";
        contentInput.style.color = "";
        contentInput.style.caretColor = "";
        counter.classList.remove("warning-count");

        showToast("🎉 Google Sheets에 아이디어가 저장되었습니다!", "success");

    } catch (error) {
        console.error("아이디어 저장 실패:", error);
        showToast("❌ 저장 실패: " + (error.message || "네트워크 또는 서버 오류"), "error");
        warning.textContent = "저장에 실패했습니다. 연결 주소와 시트 설정을 확인한 뒤 다시 시도해 주세요.";
        warning.style.display = "block";

    } finally {
        submitButton.disabled = false;
        submitButton.textContent = submitButton.dataset.originalText || "🚀 아이디어 등록하기 💥";
        delete submitButton.dataset.originalText;
    }
});


/* ==========================================
   15. 아이디어 카드 생성
========================================== */

function addIdea(category, content, id, createdAt, initialLikes = 0, showEffects = true) {

    const emptyMessage = ideaList.querySelector(
        ".empty-message"
    );

    if (emptyMessage) {
        emptyMessage.remove();
    }

    // 카드 생성
    const card = document.createElement("article");

    card.className = "idea-item";
    card.dataset.id = id || "";

    // 분야별 색상 지정
    const hue = categoryHues[category] ?? 250;

    card.style.setProperty("--card-hue", hue);

    // 상단 영역
    const top = document.createElement("div");

    top.className = "idea-top";

    const tag = document.createElement("span");

    tag.className = "idea-category";
    tag.textContent = category;

    // 등록 시간
    const date = document.createElement("span");

    date.className = "idea-date";

    date.textContent = createdAt || new Date().toLocaleString("ko-KR");

    // 제안 내용
    const text = document.createElement("p");

    text.className = "idea-content";
    text.textContent = content;

    // 버튼 영역
    const actions = document.createElement("div");

    actions.className = "idea-actions";

    // 공감 버튼: 한 브라우저 세션에서 제안마다 한 번만 공감할 수 있습니다.
    const likeButton = document.createElement("button");

    likeButton.type = "button";
    likeButton.className = "action-button like-button";

    let likes = Number(initialLikes) || 0;
    let likeBusy = false;
    const likeStorageKey = "schoolIdeaLiked_" + (id || "unknown");
    let liked = sessionStorage.getItem(likeStorageKey) === "1";

    likeButton.textContent = (liked ? "💖 공감 " : "🤍 공감 ") + likes;
    likeButton.classList.toggle("liked", liked);
    likeButton.setAttribute("aria-pressed", String(liked));
    likeButton.disabled = liked;

    likeButton.addEventListener("click", async function() {

        if (likeBusy || liked) return;
        if (!card.dataset.id) {
            showToast("저장된 제안 정보를 찾을 수 없습니다.", "error");
            return;
        }

        likeBusy = true;
        likeButton.disabled = true;

        try {
            const result = await apiPost({
                action: "like",
                id: card.dataset.id,
                delta: 1
            });

            liked = true;
            sessionStorage.setItem(likeStorageKey, "1");
            likes = Number(result.likes) || 0;

            likeButton.textContent = "💖 공감 " + likes;
            likeButton.classList.add("liked");
            likeButton.setAttribute("aria-pressed", "true");

            const rect = likeButton.getBoundingClientRect();
            megaBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            createHeart(rect.left + rect.width / 2, rect.top);
            showToast("💖 공감이 Google Sheets에 반영되었습니다!", "success");

        } catch (error) {
            console.error("공감 수 저장 실패:", error);
            showToast("공감 반영 실패: " + (error.message || "서버 오류"), "error");
            likeButton.disabled = false;
        } finally {
            likeBusy = false;
            if (liked) likeButton.disabled = true;
        }
    });

    // 복사 버튼
    const copyButton = document.createElement("button");

    copyButton.type = "button";
    copyButton.className = "action-button copy-button";
    copyButton.textContent = "📋 복사";

    copyButton.addEventListener("click", async function() {

        try {

            await navigator.clipboard.writeText(content);

            const rect = copyButton.getBoundingClientRect();

            createBurst(
                rect.left + rect.width / 2,
                rect.top + rect.height / 2,
                25
            );

            showToast(
                "📋 제안 내용을 복사했습니다!",
                "success"
            );

        } catch (error) {

            showToast(
                "복사할 수 없습니다. 브라우저 권한을 확인해 주세요.",
                "error"
            );
        }
    });


    // 삭제 버튼
    const deleteButton = document.createElement("button");

    deleteButton.type = "button";
    deleteButton.className = "action-button delete-button";
    deleteButton.textContent = "🗑 삭제";

    deleteButton.addEventListener("click", function() {
        deleteIdea(card);
    });


    // 카드 조립
    top.appendChild(tag);
    top.appendChild(date);

    actions.appendChild(likeButton);
    actions.appendChild(copyButton);
    actions.appendChild(deleteButton);

    card.appendChild(top);
    card.appendChild(text);
    card.appendChild(actions);

    // 맨 위에 카드 추가
    ideaList.prepend(card);

    updateCount();

    // 카드 자체의 축하 효과
    const rect = card.getBoundingClientRect();

    createBurst(
        rect.left + rect.width / 2,
        rect.top + 20,
        18,
        65
    );
}


/* ==========================================
   16. 아이디어 삭제
========================================== */

async function deleteIdea(card) {

    if (card.classList.contains("removing") || card.dataset.deleting === "true") {
        return;
    }

    const id = card.dataset.id;
    if (!id) {
        showToast("삭제할 제안의 ID를 찾을 수 없습니다.", "error");
        return;
    }

    card.dataset.deleting = "true";

    try {
        // 스프레드시트에서 해당 ID의 행을 먼저 삭제합니다.
        await apiPost({ action: "delete", id: id });

        const rect = card.getBoundingClientRect();
        megaBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

        card.classList.add("removing");
        showToast("💥 제안이 Google Sheets와 목록에서 삭제되었습니다.", "success");

        setTimeout(() => {
            card.remove();
            updateCount();
        }, 360);

    } catch (error) {
        delete card.dataset.deleting;
        console.error("아이디어 삭제 실패:", error);
        showToast("❌ 삭제 실패: " + (error.message || "서버 오류"), "error");
    }
}


/* ==========================================
   17. 등록 개수 갱신
========================================== */

function updateCount() {

    const count = ideaList.querySelectorAll(
        ".idea-item"
    ).length;

    ideaCount.textContent = count;

    if (count === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-message";

        empty.textContent =
            "🌟 아직 등록된 아이디어가 없습니다. 첫 번째 아이디어를 등록해 보세요!";

        ideaList.appendChild(empty);
    }
}


/* ==========================================
   18. 입력 초기화 버튼
========================================== */

document.getElementById("clearButton").addEventListener(

        );

);


/* ==========================================
   19. 키보드 단축키와 특수키
========================================== */

document.addEventListener("keydown", function(event) {

    // Ctrl + Enter : 제안 등록
    if (
        event.ctrlKey &&
        event.key === "Enter"
    ) {

        event.preventDefault();

        form.requestSubmit();

        showToast(
            "⌨️ 키보드 단축키로 등록을 시도했습니다!",
            "success"
        );
    }

    // ESC : 경고 메시지 닫기
    if (event.key === "Escape") {

        warning.style.display = "none";

        const active = document.activeElement;

        if (
            active === contentInput ||
            active === categoryInput
        ) {
            active.blur();

            showToast(
                "✨ 입력 포커스를 해제했습니다.",
                "success"
            );
        }
    }

    // Backspace : 삭제 키 입력 시 미세 효과
    if (
        event.key === "Backspace" &&
        event.target === contentInput
    ) {

        const rect = contentInput.getBoundingClientRect();

        createBurst(
            rect.left + Math.random() * rect.width,
            rect.top + 20 + Math.random() * 40,
            4,
            25
        );
    }

});


/* ==========================================
   20. 스크롤 진행 효과
========================================== */

const scrollProgress = document.getElementById(
    "scrollProgress"
);

window.addEventListener("scroll", function() {

    const scrollable =
        document.documentElement.scrollHeight -
        window.innerHeight;

    const progress = scrollable > 0
        ? (window.scrollY / scrollable) * 100
        : 0;

    scrollProgress.style.width = progress + "%";

}, { passive: true });


/* ==========================================
   Google Sheets에 저장된 기존 제안 불러오기
========================================== */

async function loadIdeas() {

    ideaList.innerHTML = '<div class="empty-message">☁️ Google Sheets에서 제안을 불러오는 중...</div>';

    try {
        const result = await apiGet("list");
        const ideas = Array.isArray(result.ideas) ? result.ideas : [];

        ideaList.innerHTML = "";

        // prepend로 최신 항목이 위에 오도록 오래된 순서부터 렌더링합니다.
        ideas.slice().reverse().forEach(function(idea) {
            addIdea(
                idea.category,
                idea.content,
                idea.id,
                idea.createdAt,
                idea.likes,
                false
            );
        });

        updateCount();

        if (ideas.length > 0) {
            showToast("☁️ Google Sheets에서 " + ideas.length + "개의 제안을 불러왔습니다.", "success");
        }

    } catch (error) {
        console.error("제안 목록 불러오기 실패:", error);
        ideaList.innerHTML = "";

        const message = document.createElement("div");
        message.className = "empty-message";
        message.textContent = "⚠️ 제안 목록을 불러오지 못했습니다. Apps Script 배포 URL과 스프레드시트 설정을 확인해 주세요.";
        ideaList.appendChild(message);

        ideaCount.textContent = "?";
        showToast("목록 불러오기 실패: " + (error.message || "서버 오류"), "error");
    }
}


/* ==========================================
   21. 페이지 처음 로딩 효과
========================================== */

window.addEventListener("load", function() {

    // 페이지가 열릴 때 Google Sheets에 저장된 기존 데이터를 가져옵니다.
    loadIdeas();

    if (!reducedMotion) {

        setTimeout(() => {

            megaBurst(
                window.innerWidth / 2,
                Math.min(window.innerHeight * .38, 250)
            );

        }, 300);
    }

    showToast(
        "🌌 아이디어 갤러리에 오신 것을 환영합니다!",
        "success"
    );
});
